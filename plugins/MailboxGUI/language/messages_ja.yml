# 紙の手紙と本の手紙は送信設定が別です。プレイヤー用コマンドには種類とコマンドの両方の有効化が必要です。管理者設定は独立しており、既存の手紙は引き続き管理できます。
# gui.ymlは表示と通知アイテムのメタデータを変更しますが、配置、未確認メールの状態管理、必須の受信箱保護は変更しません。
# ゲーム内テキストは従来の & 色コード、HEX（&#RRGGBB または <#RRGGBB>）、制限付きMiniMessageの視覚的な装飾に対応します。クリック、ホバー、コマンドの対話タグには対応しません。
# ============================================================
# MailboxGUI | 全般
# ============================================================
# 表示テキストだけを編集し、キー、プレースホルダー、色コードは保持してください。
# バージョン項目と旧言語ファイルは移行の参照用です。更新時は独自の翻訳を保持し、ファイルの削除や設定のリセットはしないでください。
# 紙の手紙と荷物・送金のメッセージは、表示文字256文字、1行28文字、本文全体17行までです。自動折り返し、/n、実際の改行、空行はこの上限を共有します。//nは文字列/nを表示し、色コードは文字数に含みません。

# ------------------------------------------------------------
# コマンド構文
# ------------------------------------------------------------
# コマンド構文には独立した言語設定があり、メッセージの言語設定には自動的に従いません。
# locale.command-syntax.default: 起動時に登録するのは、この言語のルートコマンドと、常に利用できる英語のルートコマンドのみです。
# 登録するルートコマンドを変更するにはサーバーの再起動が必要です。reloadでは新しいルートコマンドは登録されません。
# locale.command-syntax.auto-detect-player-locale: trueの場合、対応するMinecraftクライアント言語をサブコマンド、ヘルプの引数、フラグ、タブ補完にのみ使用し、ルートコマンドには適用しません。
# falseの場合、構文は使用したルートコマンドの言語に従います。/mbは英語、/bzはスペイン語などです（起動時に登録されている場合）。
# コンソールや未対応のクライアント言語では、呼び出したルートコマンドの言語を使用します。command-syntax.default: esでも/mbaは英語のままです。
# メッセージ、GUI、日付の言語設定はコマンド構文から独立しています。

