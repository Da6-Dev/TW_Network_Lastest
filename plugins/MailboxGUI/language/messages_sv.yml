# Pappers- och bokbrev har separata sändningsinställningar; spelarkommandon kräver både typ- och kommandovalet. Administratörsval är oberoende; befintliga brev kan fortfarande hanteras.
# gui.yml ändrar utseende och aviseringsmetadata, inte fysisk placering, status för okontrollerad post eller obligatoriskt inkorgsskydd.
# Speltext stöder klassiska &-färger, HEX (&#RRGGBB eller <#RRGGBB>) och begränsad visuell MiniMessage-formatering. Interaktiva klick-, hovrings- och kommandotaggar stöds inte.
# ============================================================
# MailboxGUI | Allmänt
# ============================================================
# Redigera bara visad text; behåll nycklar, platshållare och färgkoder.
# Versionsfält och äldre språkfiler är migreringsreferenser. Behåll egna översättningar vid uppgraderingar; radera inte filer och återställ inte inställningar.
# Pappersbrev och paket-/pengameddelanden tillåter 256 synliga tecken, 28 per rad och totalt 17 textrader. Automatisk radbrytning, /n, riktiga radbrytningar och tomma rader delar denna gräns. //n visar /n bokstavligt; färgkoder räknas inte.

# ------------------------------------------------------------
# Kommandosyntax
# ------------------------------------------------------------
# Kommandosyntaxen har egna språkinställningar och följer inte meddelandespråket automatiskt.
# locale.command-syntax.default: Vid start registreras ENDAST denna språkinställnings rotkommandon samt engelska rotkommandon, som alltid är tillgängliga.
# Servern måste startas om för att ändra registrerade rotkommandon; reload registrerar inga nya rotkommandon.
# locale.command-syntax.auto-detect-player-locale: true använder Minecraft-klientens språk, om det stöds, ENDAST för underkommandon, hjälpargument, flaggor och tabbkomplettering, aldrig för rotkommandon.
# Med false följer syntaxen det använda rotkommandot: /mb på engelska, /bz på spanska osv. (om det registrerades vid start).
# Konsolen och klienter med språk som inte stöds använder det anropade rotkommandots språk: /mba förblir engelskt även med command-syntax.default: es.
# Språket för meddelanden, gränssnitt och datum är oberoende av kommandosyntaxen.

