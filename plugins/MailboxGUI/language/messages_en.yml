# Paper/book sending uses separate type settings; each player command requires its type and command flags. Admin gates are independent; existing letters remain manageable.
# gui.yml changes display appearance and notification item metadata, not physical placement, unchecked-mail lifecycle or mandatory inbox protection.
# In-game text supports legacy & colors, HEX (&#RRGGBB or <#RRGGBB>) and restricted visual MiniMessage formatting. Interactive click/hover/command tags are not supported.
# ============================================================
# MailboxGUI | General
# ============================================================
# Edit displayed text only; preserve keys, placeholders and color codes.
# Version fields and legacy language snapshots are migration references. Keep owner translations during upgrades; do not delete files or reset settings.
# Paper letters and package/money messages allow 256 visible characters, 28 per line and 17 total body lines. Wrapping, /n, actual line breaks and blank lines share this limit. //n displays literal /n; color codes do not count.

# ------------------------------------------------------------
# Command syntax
# ------------------------------------------------------------
# Command syntax has independent language settings; it does not follow message-language settings automatically.
# locale.command-syntax.default: At startup, registers ONLY this language's command roots plus English roots, which are always available.
# Changing the registered roots requires a server restart; reload does not register new roots.
# locale.command-syntax.auto-detect-player-locale: true uses the supported Minecraft client language ONLY for subcommands, help arguments, flags and tab completion, never for roots.
# With false, syntax follows the root used: /mb uses English, /bz uses Spanish, etc. (if that root was registered at startup).
# Console and unsupported client locales fall back to the invoking root's language: /mba remains English even with command-syntax.default: es.
# Message, GUI and date locales remain independent of command syntax.

