    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<gold>MailboxGUI Book Letter"
    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<gray>From: %sender%"
    - "<gray>Date: %date%"
    - "<gray>Title: %title%"
    - "<gray>Expires: %expiration%"
    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<dark_green>Go to the next page to read this Book Letter."
    - "%reply%"
    - "%back%"
