# Listy papierowe i książkowe mają osobne ustawienia wysyłania; polecenia graczy wymagają włączenia typu i polecenia. Ustawienia administratora są niezależne; istniejące listy nadal można obsługiwać.
# gui.yml zmienia wygląd i metadane powiadomienia, nie położenie, stan niesprawdzonej poczty ani obowiązkową ochronę skrzynki.
# Tekst w grze obsługuje klasyczne kolory &, HEX (&#RRGGBB lub <#RRGGBB>) i ograniczone formatowanie wizualne MiniMessage. Interaktywne znaczniki kliknięcia, najechania i poleceń nie są obsługiwane.
# ============================================================
# MailboxGUI | Ogólne
# ============================================================
# Edytuj tylko wyświetlany tekst; zachowaj klucze, symbole zastępcze i kody kolorów.
# Pola wersji i stare pliki językowe są odniesieniami migracji. Zachowaj własne tłumaczenia podczas aktualizacji; nie usuwaj plików ani nie resetuj ustawień.
# Listy papierowe i wiadomości paczek/pieniężne pozwalają na 256 widocznych znaków, 28 na wiersz i łącznie 17 wierszy treści. Automatyczne zawijanie, /n, rzeczywiste podziały i puste wiersze dzielą ten limit. //n wyświetla dosłowne /n; kody kolorów nie są liczone.

# ------------------------------------------------------------
# Składnia poleceń
# ------------------------------------------------------------
# Składnia poleceń ma niezależne ustawienia języka i nie przyjmuje automatycznie języka wiadomości.
# locale.command-syntax.default: Przy uruchomieniu rejestruje TYLKO polecenia główne tego języka oraz angielskie, które są zawsze dostępne.
# Zmiana zarejestrowanych poleceń głównych wymaga ponownego uruchomienia serwera; reload nie rejestruje nowych poleceń głównych.
# locale.command-syntax.auto-detect-player-locale: true używa obsługiwanego języka klienta Minecraft TYLKO dla podpoleceń, argumentów pomocy, flag i uzupełniania klawiszem Tab, nigdy dla poleceń głównych.
# Przy false składnia zależy od użytego polecenia głównego: /mb po angielsku, /bz po hiszpańsku itd. (jeśli zarejestrowano je przy uruchomieniu).
# Konsola i klienci z nieobsługiwanym językiem używają języka wywołanego polecenia głównego: /mba pozostaje po angielsku nawet przy command-syntax.default: es.
# Języki wiadomości, interfejsu i dat pozostają niezależne od składni poleceń.

