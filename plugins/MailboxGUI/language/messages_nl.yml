# Papier- en boekbrieven hebben afzonderlijke verzendinstellingen; spelercommando’s vereisen zowel de type- als commandoschakelaar. Beheerdersinstellingen zijn onafhankelijk; bestaande brieven blijven beheerbaar.
# gui.yml verandert uiterlijk en meldingsmetadata, niet de fysieke positie, ongelezen-mailcyclus of verplichte inboxbescherming.
# Speltekst ondersteunt klassieke &-kleuren, HEX (&#RRGGBB of <#RRGGBB>) en beperkte visuele MiniMessage-opmaak. Interactieve klik-, hover- en opdrachttags worden niet ondersteund.
# ============================================================
# MailboxGUI | Algemeen
# ============================================================
# Bewerk alleen weergegeven tekst; behoud sleutels, placeholders en kleurcodes.
# Versievelden en oude taalbestanden zijn migratiereferenties. Behoud eigen vertalingen bij upgrades; verwijder geen bestanden en herstel geen instellingen naar standaardwaarden.
# Papieren brieven en pakket-/geldberichten staan 256 zichtbare tekens, 28 per regel en 17 tekstregels in totaal toe. Automatisch afbreken, /n, echte regeleinden en lege regels delen deze limiet. //n toont letterlijk /n; kleurcodes tellen niet mee.

# ------------------------------------------------------------
# Opdrachtsyntaxis
# ------------------------------------------------------------
# Opdrachtsyntaxis heeft afzonderlijke taalinstellingen en volgt niet automatisch de taal van berichten.
# locale.command-syntax.default: Registreert bij het opstarten ALLEEN de basiscommando's van deze taal en de Engelse basiscommando's, die altijd beschikbaar zijn.
# Om de geregistreerde basiscommando's te wijzigen moet de server opnieuw worden gestart; reload registreert geen nieuwe basiscommando's.
# locale.command-syntax.auto-detect-player-locale: true gebruikt de ondersteunde Minecraft-clienttaal ALLEEN voor subcommando's, hulpargumenten, opties en tabaanvulling, nooit voor basiscommando's.
# Bij false volgt de syntaxis het gebruikte basiscommando: /mb in het Engels, /bz in het Spaans, enz. (indien bij het opstarten geregistreerd).
# De console en clients met een niet-ondersteunde taal vallen terug op de taal van het aangeroepen basiscommando: /mba blijft Engels, ook met command-syntax.default: es.
# De taal van berichten, de interface en datums blijft onafhankelijk van de opdrachtsyntaxis.

