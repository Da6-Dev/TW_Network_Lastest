# Los envíos de papel y libro tienen ajustes separados; cada comando de jugador requiere activar el tipo y el comando. Los permisos de envío de administrador son independientes; las cartas existentes siguen siendo gestionables.
# gui.yml cambia la apariencia y los metadatos del aviso, no su posición, el estado de correo sin revisar ni la protección obligatoria del buzón.
# El texto del juego admite colores & clásicos, HEX (&#RRGGBB o <#RRGGBB>) y formato visual restringido de MiniMessage. No se admiten etiquetas interactivas de clic, información al pasar el cursor ni comandos.
# ============================================================
# MailboxGUI | General
# ============================================================
# Edita solo el texto mostrado; conserva las claves, los marcadores y los códigos de color.
# Los campos de versión y los archivos de idiomas antiguos son referencias de migración. Conserva las traducciones propias al actualizar; no borres archivos ni restablezcas ajustes.
# Las cartas de papel y los mensajes de paquetes/dinero admiten 256 caracteres visibles, 28 por línea y 17 líneas de texto en total. El ajuste automático, /n, los saltos reales y las líneas vacías comparten este límite. //n muestra /n literalmente; los códigos de color no cuentan.

# ------------------------------------------------------------
# Sintaxis de comandos
# ------------------------------------------------------------
# La sintaxis de comandos tiene ajustes de idioma independientes; no adopta automáticamente el idioma de los mensajes.
# locale.command-syntax.default: Al iniciar, registra SOLO los comandos raíz de este idioma y los ingleses, que siempre están disponibles.
# Cambiar los comandos raíz registrados requiere reiniciar el servidor; reload no registra nuevos comandos raíz.
# locale.command-syntax.auto-detect-player-locale: true usa el idioma compatible del cliente Minecraft SOLO para subcomandos, argumentos de ayuda, opciones y autocompletado, nunca para comandos raíz.
# Con false, la sintaxis sigue el comando raíz usado: /mb en inglés, /bz en español, etc. (si se registró al iniciar).
# La consola y los clientes con idiomas no compatibles usan como alternativa el idioma del comando raíz invocado: /mba sigue en inglés incluso con command-syntax.default: es.
# Los idiomas de los mensajes, la interfaz y las fechas son independientes de la sintaxis de comandos.

