  help-desc-admin-testaimoney: "<gray>Создает общий почтовый ящик администратора COD для проверки денежных средств. Сумма контролирует количество созданных."
  help-desc-admin-testaipackage: "<gray>Создает тестовое письмо общего пакета входящих сообщений администратора для возвращенных потоков платежей COD и item-currency."
