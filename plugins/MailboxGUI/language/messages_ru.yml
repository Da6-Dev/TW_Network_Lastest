  # Первая страница книги: изменяйте этот упорядоченный список, чтобы настроить разделители, подписи, подсказки чтения и расположение ответа/возврата. Сохраняйте заполнители; пустой срок действия убирает всю строку.
  # %sender% %date% %title% %expiration% %reply% %back%
  book-letter-information-page:
    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<gold>Книжное письмо MailboxGUI"
    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<gray>От: %sender%"
    - "<gray>Дата: %date%"
    - "<gray>Заголовок: %title%"
    - "<gray>Истекает: %expiration%"
    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<dark_green>Перейдите на следующую страницу, чтобы прочитать это книжное письмо."
    - "%reply%"
    - "%back%"
  # Пустое значение автоматически выбирает формат даты и времени страны и языка. Можно указать шаблон даты/времени Java; буквы шаблона не переводите.
