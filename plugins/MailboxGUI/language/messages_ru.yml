  help-desc-admin-clean: "<gray>Очищает файлы резервных копий MailboxGUI от старых обновлений, синхронизаций и преобразований. Перед использованием убедитесь, что почтовые данные работают."
  help-desc-admin-convert: "<gray>Преобразует хранилище MailboxGUI в выбранный режим. Целью не может быть текущий режим хранения."
