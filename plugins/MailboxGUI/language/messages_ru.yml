  help-desc-admin-inboxnotification: "<gray>Переключить онлайн-оповещения общего почтового ящика администратора. Не используйте загруженные серверы, если вам не нужны частые уведомления администратора."
  help-desc-admin-itemtemplate-delete: "<gray>Удаляет сохраненный шаблон элемента пакета."
  help-desc-admin-itemtemplate-give: "<gray>Предоставляет сохраненный шаблон элемента пакета."
  help-desc-admin-itemtemplate-list: "<gray>Перечисляет сохраненные шаблоны элементов пакета."
  help-desc-admin-itemtemplate-save: "<gray>Сохраняет удерживаемый элемент как шаблон пакета."
  help-desc-admin-purge: "<gray>Очищает содержимое папки «Входящие», не удаляя записи игроков, почтовые ящики, настройки или данные плагина."
  help-desc-admin-register: "<gray>Регистрирует почтовый ящик на конкретного игрока."
  help-desc-admin-reload: "<gray>Перезагружает конфиги и языковые файлы."
  help-desc-admin-scheduledmail: "<gray>Управление запланированными почтовыми задачами из запланированного-mail/scheduled-mail.yml."
  help-desc-admin-send-book-letter: "<gray>Отправляет письмо администратору с помощью команды или консоли."
