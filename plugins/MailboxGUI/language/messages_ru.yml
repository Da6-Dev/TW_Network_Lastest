# У бумажных и книжных писем отдельные настройки отправки; команда игрока требует включения типа и команды. Настройки администратора независимы; уже доставленные письма остаются доступными.
# gui.yml меняет вид и метаданные уведомления, но не положение, состояние непроверенной почты или обязательную защиту ящика.
# Текст в игре поддерживает обычные цвета &, HEX (&#RRGGBB или <#RRGGBB>) и ограниченное визуальное форматирование MiniMessage. Интерактивные теги клика, наведения и команд не поддерживаются.
# ============================================================
# MailboxGUI | Общие настройки
# ============================================================
# Изменяйте только отображаемый текст; сохраняйте ключи, заполнители и коды цвета.
# Поля версии и старые языковые файлы служат эталонами миграции. Сохраняйте собственные переводы при обновлении; не удаляйте файлы и не сбрасывайте настройки.
# Бумажные письма и сообщения посылок/денежной почты допускают 256 видимых символов, 28 в строке и 17 строк текста всего. Автоматический перенос, /n, реальные переводы строки и пустые строки делят этот лимит. //n выводит буквальное /n; коды цвета не учитываются.

# ------------------------------------------------------------
# Синтаксис команд
# ------------------------------------------------------------
# У синтаксиса команд отдельные языковые настройки; язык сообщений не применяется к нему автоматически.
# locale.command-syntax.default: При запуске регистрируются ТОЛЬКО корневые команды этого языка и английские корневые команды, которые доступны всегда.
# Для изменения зарегистрированных корневых команд нужен перезапуск сервера; reload не регистрирует новые корневые команды.
# locale.command-syntax.auto-detect-player-locale: true использует поддерживаемый язык клиента Minecraft ТОЛЬКО для подкоманд, аргументов справки, флагов и автодополнения, но не для корневых команд.
# При false синтаксис следует языку использованной корневой команды: /mb на английском, /bz на испанском и т. д. (если команда зарегистрирована при запуске).
# Для консоли и неподдерживаемых языков клиента используется язык вызванной корневой команды: /mba остаётся на английском даже при command-syntax.default: es.
# Языки сообщений, интерфейса и дат остаются независимыми от синтаксиса команд.

