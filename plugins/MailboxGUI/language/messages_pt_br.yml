# Cartas de papel e de livro têm configurações de envio separadas; cada comando de jogador exige ativar o tipo e o comando. As opções de administrador são independentes; cartas existentes continuam acessíveis.
# gui.yml muda a aparência e os metadados do aviso, não a posição física, o estado de correio não verificado nem a proteção obrigatória da caixa.
# O texto no jogo aceita cores & clássicas, HEX (&#RRGGBB ou <#RRGGBB>) e formatação visual restrita do MiniMessage. Etiquetas interativas de clique, passagem do cursor e comando não são aceitas.
# ============================================================
# MailboxGUI | Geral
# ============================================================
# Edite apenas o texto exibido; preserve as chaves, os marcadores e os códigos de cor.
# Os campos de versão e os arquivos de idioma antigos são referências de migração. Preserve as traduções personalizadas nas atualizações; não exclua arquivos nem redefina configurações.
# Cartas de papel e mensagens de pacotes/dinheiro permitem 256 caracteres visíveis, 28 por linha e 17 linhas de texto no total. Quebras automáticas, /n, quebras reais e linhas vazias compartilham esse limite. //n exibe /n literalmente; códigos de cor não contam.

# ------------------------------------------------------------
# Sintaxe dos comandos
# ------------------------------------------------------------
# A sintaxe dos comandos tem configurações de idioma independentes; ela não segue automaticamente o idioma das mensagens.
# locale.command-syntax.default: Na inicialização, registra SOMENTE os comandos raiz deste idioma e os ingleses, que estão sempre disponíveis.
# Alterar os comandos raiz registrados exige reiniciar o servidor; reload não registra novos comandos raiz.
# locale.command-syntax.auto-detect-player-locale: true usa o idioma compatível do cliente Minecraft SOMENTE para subcomandos, argumentos de ajuda, opções e autocompletar, nunca para comandos raiz.
# Com false, a sintaxe segue o comando raiz usado: /mb em inglês, /bz em espanhol etc. (se registrado na inicialização).
# O console e os clientes com idiomas não compatíveis usam como alternativa o idioma do comando raiz invocado: /mba continua em inglês mesmo com command-syntax.default: es.
# Os idiomas das mensagens, da interface e das datas permanecem independentes da sintaxe dos comandos.

