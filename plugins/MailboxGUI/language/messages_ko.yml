# 종이 편지와 책 편지는 송신 설정이 별도입니다. 플레이어 명령에는 종류와 명령 설정이 모두 활성화되어야 합니다. 관리자 설정은 독립적이며 기존 편지는 계속 관리할 수 있습니다.
# gui.yml은 표시 및 알림 아이템의 메타데이터만 변경하며 위치, 확인하지 않은 우편의 상태 관리, 필수 받은 편지함 보호는 변경하지 않습니다.
# 게임 내 텍스트는 기존 & 색상, HEX(&#RRGGBB 또는 <#RRGGBB>) 및 제한된 MiniMessage 시각적 서식을 지원합니다. 클릭, 마우스 오버, 명령 같은 상호작용 태그는 지원하지 않습니다.
# ============================================================
# MailboxGUI | 일반
# ============================================================
# 표시되는 텍스트만 편집하고 키, 자리 표시자, 색상 코드는 유지하세요.
# 버전 필드와 이전 언어 파일은 마이그레이션 참조 자료입니다. 업데이트 시 사용자 번역을 유지하고 파일을 삭제하거나 설정을 초기화하지 마세요.
# 종이 편지와 소포·송금 메시지는 표시 문자 256자, 한 줄 28자, 본문 전체 17줄까지 허용합니다. 자동 줄바꿈, /n, 실제 줄바꿈 및 빈 줄은 이 한도를 공유합니다. //n은 /n을 문자 그대로 표시하며 색상 코드는 글자 수에 포함되지 않습니다.

# ------------------------------------------------------------
# 명령어 구문
# ------------------------------------------------------------
# 명령어 구문에는 독립적인 언어 설정이 있으며 메시지 언어를 자동으로 따르지 않습니다.
# locale.command-syntax.default: 시작 시 이 언어의 루트 명령어와 항상 사용할 수 있는 영어 루트 명령어만 등록합니다.
# 등록할 루트 명령어를 변경하려면 서버를 다시 시작해야 합니다. reload는 새 루트 명령어를 등록하지 않습니다.
# locale.command-syntax.auto-detect-player-locale: true이면 지원되는 Minecraft 클라이언트 언어를 하위 명령어, 도움말 인수, 플래그 및 탭 자동 완성에만 사용하며 루트 명령어에는 적용하지 않습니다.
# false이면 구문은 사용한 루트 명령어의 언어를 따릅니다. /mb는 영어, /bz는 스페인어 등입니다(시작 시 등록된 경우).
# 콘솔과 지원되지 않는 클라이언트 언어는 호출한 루트 명령어의 언어를 사용합니다. command-syntax.default: es여도 /mba는 영어로 유지됩니다.
# 메시지, GUI 및 날짜의 언어 설정은 명령어 구문과 독립적입니다.

file-version: 16

messages:
