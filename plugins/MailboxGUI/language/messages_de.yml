# Papier- und Buchbriefe haben getrennte Sendeeinstellungen; Spielerbefehle benötigen die Typ- und Befehlsfreigabe. Admin-Freigaben sind unabhängig; vorhandene Briefe bleiben verwaltbar.
# gui.yml ändert die Darstellung und Benachrichtigungs-Metadaten, nicht die Position, den Ungelesen-Status oder den obligatorischen Postfachschutz.
# Spieltexte unterstützen klassische &-Farben, HEX (&#RRGGBB oder <#RRGGBB>) und eingeschränkte visuelle MiniMessage-Formatierung. Interaktive Klick-, Hover- und Befehls-Tags werden nicht unterstützt.
# ============================================================
# MailboxGUI | Allgemeines
# ============================================================
# Nur angezeigten Text bearbeiten; Schlüssel, Platzhalter und Farbcodes beibehalten.
# Versionsfelder und alte Sprachdateien dienen als Migrationsreferenzen. Eigene Übersetzungen bei Upgrades erhalten; keine Dateien löschen oder Einstellungen zurücksetzen.
# Papierbriefe und Paket-/Geldnachrichten erlauben 256 sichtbare Zeichen, 28 je Zeile und insgesamt 17 Textzeilen. Automatischer Umbruch, /n, echte Zeilenumbrüche und Leerzeilen teilen dieses Limit. //n zeigt /n wörtlich; Farbcodes zählen nicht.

# ------------------------------------------------------------
# Befehlssyntax
# ------------------------------------------------------------
# Die Befehlssyntax hat eigene Spracheinstellungen und übernimmt nicht automatisch die Nachrichtensprache.
# locale.command-syntax.default: Beim Start werden NUR die Befehlswurzeln dieser Sprache sowie die stets verfügbaren englischen Befehlswurzeln registriert.
# Zum Ändern der registrierten Befehlswurzeln ist ein Serverneustart nötig; reload registriert keine neuen Befehlswurzeln.
# locale.command-syntax.auto-detect-player-locale: true verwendet die unterstützte Minecraft-Clientsprache NUR für Unterbefehle, Hilfeargumente, Flags und Tab-Vervollständigung, niemals für Befehlswurzeln.
# Bei false folgt die Syntax der verwendeten Befehlswurzel: /mb auf Englisch, /bz auf Spanisch usw. (sofern beim Start registriert).
# Für die Konsole und nicht unterstützte Clientsprachen gilt die Sprache der aufgerufenen Befehlswurzel: /mba bleibt auch mit command-syntax.default: es Englisch.
# Die Sprache von Nachrichten, GUI und Datumsangaben bleibt von der Befehlssyntax unabhängig.

