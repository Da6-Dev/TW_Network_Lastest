  help-desc-settings-notification-status: "<gray>Mostra le impostazioni attuali delle notifiche."
  help-desc-settings-notification-offline: "<gray>Sceglie notifiche della posta semplici, dettagliate o disattivate all'accesso."
  help-desc-settings-notification-online: "<gray>Attiva o disattiva le notifiche di nuova posta mentre sei online."
  help-desc-settings-notification-soundalert: "<gray>Attiva o disattiva i suoni delle notifiche della posta."
  help-desc-settings-notification-kit: "<gray>Attiva o disattiva i promemoria dei kit per la casella di posta."
  help-desc-settings-resourcepack-auto: "<gray>Rileva automaticamente il pacchetto del server; i pacchetti installati nel client richiedono on."
  help-desc-settings-resourcepack-on: "<gray>Usa le icone personalizzate del pacchetto corrispondente installato e attivato nel client Minecraft."
  help-desc-settings-resourcepack-off: "<gray>Usa le icone predefinite anche quando è caricato un pacchetto di risorse del server."
  settings-kit-uses-unlimited: "Illimitati"
  help-desc-track: "<gray>Mostra la posta in ritardo in attesa di essere consegnata."
  help-desc-unregister: "<gray>Annulla registrazione di una casella di posta."
