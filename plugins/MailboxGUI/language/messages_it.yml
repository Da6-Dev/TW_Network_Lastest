  help-desc-admin-admininbox: "<gray>Apri la posta in arrivo dell'amministratore condiviso."
  help-desc-admin-base: "<gray>Comando di amministrazione di base e apre il menu della guida di amministrazione."
  help-desc-admin-clean: "<gray>Pulisce i file di backup MailboxGUI da vecchi aggiornamenti, sincronizzazioni e conversioni. Confermare che i dati di posta funzionino prima dell'uso."
  help-desc-admin-convert: "<gray>Converte lo spazio di archiviazione MailboxGUI nella modalità selezionata. La destinazione non può essere la modalità di archiviazione corrente."
  help-desc-admin-convert-current: "<gray>Mostra la modalità di archiviazione MailboxGUI attualmente attiva."
  help-desc-admin-import-playerdata: "<gray>Crea dati MailboxGUI per i giocatori nominati che hanno effettuato l'accesso in precedenza."
  help-desc-admin-inboxnotification: "<gray>Attiva/disattiva gli avvisi online della posta in arrivo dell'amministratore condiviso. Lascia stare i server occupati a meno che tu non voglia frequenti avvisi da parte dell'amministratore."
  help-desc-admin-itemtemplate-delete: "<gray>Elimina un modello di elemento del pacchetto salvato."
  help-desc-admin-itemtemplate-give: "<gray>Fornisce un modello di elemento del pacchetto salvato."
  help-desc-admin-itemtemplate-list: "<gray>Elenca i modelli di articoli del pacchetto salvati."
  help-desc-admin-itemtemplate-save: "<gray>Salva l'elemento bloccato come modello di pacchetto."
  help-desc-admin-purge: "<gray>Cancella i contenuti della posta in arrivo senza eliminare i record dei giocatori, le caselle di posta, le impostazioni o i dati dei plug-in."
  help-desc-admin-register: "<gray>Registra una casella di posta su un giocatore specifico."
  help-desc-admin-reload: "<gray>Ricarica configurazioni e file di lingua."
  help-desc-admin-scheduledmail: "<gray>Gestisci le attività di posta pianificata da pianificato-mail/scheduled-mail.yml."
  help-desc-admin-send-book-letter: "<gray>Invia una lettera di prenotazione dell'amministratore tramite comando o console."
  help-desc-admin-send-cod: "<gray>Invia un COD pacchetto utilizzando la valuta del Vault, la valuta dell'articolo, i modelli XP o t:{id}."
  help-desc-admin-send-letter: "<gray>Invia una classica lettera cartacea dell'amministratore tramite comando o console."
  help-desc-admin-send-money: "<gray>Invia posta in denaro all'amministratore-origin tramite comando o console."
  help-desc-admin-send-package: "<gray>Invia materiali, XP o modelli di elementi t:{id} come pacchetto."
  help-desc-admin-testaimoney: "<gray>Crea una casella di posta amministrativa condivisa COD elementi di posta di prova per il pagamento in denaro. La quantità controlla quanti ne vengono creati."
  help-desc-admin-testaipackage: "<gray>Crea la posta di prova del pacchetto Posta in arrivo amministrativa condivisa per i flussi di pagamento restituiti COD e articolo-currency."
  help-desc-admin-testletter: "<gray>Crea più articoli di posta di prova su carta o libri con informazioni complete sulla posta in arrivo."
  help-desc-admin-testmoney: "<gray>Crea denaro nella casella di posta del giocatore o email di prova del pagamento COD."
  help-desc-admin-testpackage: "<gray>Crea un'e-mail di prova del pacchetto nella posta in arrivo del giocatore per i flussi di pacchetti standard, COD, di pagamento, restituiti e accettati."
  help-desc-admin-tools: "<gray>Apre il menu degli strumenti di amministrazione."
  help-desc-admin-unregister: "<gray>Annulla la registrazione della casella di posta registrata di un giocatore."
  help-desc-admin-update: "<gray>Mette in scena l'ultimo aggiornamento della versione del sito web dopo la conferma."
  help-desc-admin-updatecheck: "<gray>Controlla il sistema di rilascio del sito Web per la versione più recente di MailboxGUI."
  help-desc-base: "<gray>Comando Base e apre il menu di aiuto."
  help-desc-check: "<gray>Mostra un riepilogo della posta non controllata."
  help-desc-guide: "<gray>Mostra come accedere alla posta e scegliere uno stile di casella da costruire."
  help-desc-kit: "<gray>Fornisce i blocchi iniziali per costruire una casella di posta."
  help-desc-letter: "<gray>Componi e invia una lettera senza aprire una casella di posta."
  help-desc-money: "<gray>Invia posta monetaria tramite comando dopo aver scelto un destinatario e inserito l'importo in chat."
  help-desc-open: "<gray>Apre il menu della casella di posta tramite comando quando abilitato."
  help-desc-package: "<gray>Componi un pacchetto tramite comando, scegli un destinatario, aggiungi elementi o XP e invia senza utilizzare un punto di accesso alla casella di posta."
  help-desc-register: "<gray>Registra una casella di posta."
  help-desc-settings: "<gray>Mostra e modifica le impostazioni della casella di posta: notifiche, pacchetto di risorse e Discord."
  help-desc-settings-notifications-only: "<gray>Mostra e modifica le impostazioni della casella di posta: notifiche."
  help-desc-settings-with-resourcepack: "<gray>Mostra e modifica le impostazioni della casella di posta: notifiche e pacchetto di risorse."
  help-desc-settings-with-discord: "<gray>Mostra e modifica le impostazioni della casella di posta: notifiche e Discord."
  help-desc-settings-notification: "<gray>Gestisce notifiche della posta, suoni e promemoria dei kit per la casella di posta."
  help-desc-settings-resourcepack: "<gray>Sceglie le icone del pacchetto di risorse o quelle predefinite."
