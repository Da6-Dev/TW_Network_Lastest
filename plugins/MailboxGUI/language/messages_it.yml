# Le lettere cartacee e i libri hanno impostazioni separate; ogni comando giocatore richiede l’abilitazione del tipo e del comando. Le opzioni amministratore sono indipendenti; le lettere esistenti restano gestibili.
# gui.yml cambia l’aspetto e i metadati della notifica, non la posizione, lo stato della posta non controllata o la protezione obbligatoria della casella.
# Il testo nel gioco supporta i colori & classici, HEX (&#RRGGBB o <#RRGGBB>) e la formattazione visiva limitata di MiniMessage. I tag interattivi di clic, passaggio del cursore e comando non sono supportati.
# ============================================================
# MailboxGUI | Generale
# ============================================================
# Modifica solo il testo visualizzato; conserva chiavi, segnaposto e codici colore.
# I campi versione e i vecchi file di lingua sono riferimenti per la migrazione. Conserva le traduzioni personalizzate durante gli aggiornamenti; non eliminare file o ripristinare le impostazioni.
# Le lettere di carta e i messaggi di pacchi/denaro consentono 256 caratteri visibili, 28 per riga e 17 righe totali. A capo automatico, /n, interruzioni reali e righe vuote condividono questo limite. //n mostra /n letteralmente; i codici colore non contano.

# ------------------------------------------------------------
# Sintassi dei comandi
# ------------------------------------------------------------
# La sintassi dei comandi ha impostazioni di lingua indipendenti; non segue automaticamente la lingua dei messaggi.
# locale.command-syntax.default: All'avvio registra SOLO i comandi radice di questa lingua e quelli inglesi, sempre disponibili.
# Per cambiare i comandi radice registrati occorre riavviare il server; reload non registra nuovi comandi radice.
# locale.command-syntax.auto-detect-player-locale: true usa la lingua supportata del client Minecraft SOLO per sottocomandi, argomenti della guida, opzioni e completamento, mai per i comandi radice.
# Con false, la sintassi segue il comando radice usato: /mb in inglese, /bz in spagnolo, ecc. (se registrato all'avvio).
# La console e i client con lingue non supportate usano la lingua del comando radice invocato: /mba rimane in inglese anche con command-syntax.default: es.
# Le lingue di messaggi, interfaccia e date restano indipendenti dalla sintassi dei comandi.

