# Les lettres papier et livres ont des réglages d’envoi séparés ; chaque commande joueur exige les options du type et de la commande. Les réglages administrateur sont indépendants ; les lettres existantes restent gérables.
# gui.yml modifie l’apparence et les métadonnées de notification, pas la position, le suivi du courrier non consulté ni la protection obligatoire de la boîte.
# Les textes en jeu acceptent les couleurs & classiques, HEX (&#RRGGBB ou <#RRGGBB>) et la mise en forme visuelle MiniMessage restreinte. Les balises interactives de clic, survol et commande ne sont pas acceptées.
# ============================================================
# MailboxGUI | Général
# ============================================================
# Modifiez uniquement le texte affiché ; conservez les clés, les espaces réservés et les codes de couleur.
# Les champs de version et les anciens fichiers de langue servent de références de migration. Conservez les traductions personnalisées lors des mises à niveau ; ne supprimez aucun fichier et ne réinitialisez aucun paramètre.
# Les lettres papier et les messages de colis/d'argent acceptent 256 caractères visibles, 28 par ligne et 17 lignes au total. Le retour automatique, /n, les sauts réels et les lignes vides partagent cette limite. //n affiche /n littéralement ; les codes de couleur ne comptent pas.

# ------------------------------------------------------------
# Syntaxe des commandes
# ------------------------------------------------------------
# La syntaxe des commandes possède ses propres paramètres de langue ; elle ne suit pas automatiquement la langue des messages.
# locale.command-syntax.default: Au démarrage, enregistre UNIQUEMENT les commandes racines de cette langue et celles en anglais, toujours disponibles.
# Un redémarrage du serveur est nécessaire pour changer les commandes racines enregistrées ; reload n'en enregistre pas de nouvelles.
# locale.command-syntax.auto-detect-player-locale: true utilise la langue prise en charge du client Minecraft UNIQUEMENT pour les sous-commandes, arguments d'aide, options et complétion, jamais pour les commandes racines.
# Avec false, la syntaxe suit la commande racine utilisée : /mb en anglais, /bz en espagnol, etc. (si elle a été enregistrée au démarrage).
# La console et les clients dont la langue n'est pas prise en charge utilisent la langue de la commande racine appelée : /mba reste en anglais même avec command-syntax.default: es.
# Les langues des messages, de l'interface et des dates restent indépendantes de la syntaxe des commandes.

