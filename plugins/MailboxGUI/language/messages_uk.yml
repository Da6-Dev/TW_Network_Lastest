  # Перша сторінка книги: змінюйте цей упорядкований список для налаштування розділювачів, підписів, підказок читання та розташування відповіді/повернення. Зберігайте заповнювачі; порожній строк дії прибирає весь рядок.
  # %sender% %date% %title% %expiration% %reply% %back%
  book-letter-information-page:
    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<gold>Книжковий лист MailboxGUI"
    - "<dark_gray><strikethrough>--------------------</strikethrough>"
    - "<gray>Від: %sender%"
    - "<gray>Дата: %date%"
    - "<gray>Заголовок: %title%"
    - "<gray>Діє до: %expiration%"
