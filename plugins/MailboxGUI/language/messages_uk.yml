# Паперові та книжкові листи мають окремі налаштування надсилання; команда гравця потребує ввімкнення типу й команди. Налаштування адміністратора незалежні; доставлені листи залишаються доступними.
# gui.yml змінює вигляд і метадані сповіщення, але не розташування, стан неперевіреної пошти чи обов’язковий захист скриньки.
# Текст у грі підтримує звичайні кольори &, HEX (&#RRGGBB або <#RRGGBB>) та обмежене візуальне форматування MiniMessage. Інтерактивні теги натискання, наведення й команд не підтримуються.
# ============================================================
# MailboxGUI | Загальні налаштування
# ============================================================
# Змінюйте лише відображуваний текст; зберігайте ключі, заповнювачі та коди кольору.
# Поля версії та старі мовні файли є еталонами міграції. Зберігайте власні переклади під час оновлення; не видаляйте файли й не скидайте налаштування.
# Паперові листи та повідомлення пакунків/грошової пошти допускають 256 видимих символів, 28 у рядку та загалом 17 рядків тексту. Автоматичне перенесення, /n, справжні переходи й порожні рядки поділяють цей ліміт. //n показує буквальне /n; коди кольору не враховуються.

# ------------------------------------------------------------
# Синтаксис команд
# ------------------------------------------------------------
# Синтаксис команд має окремі мовні налаштування; мова повідомлень не застосовується до нього автоматично.
# locale.command-syntax.default: Під час запуску реєструються ЛИШЕ кореневі команди цієї мови та англійські кореневі команди, які доступні завжди.
# Для зміни зареєстрованих кореневих команд потрібен перезапуск сервера; reload не реєструє нові кореневі команди.
# locale.command-syntax.auto-detect-player-locale: true використовує підтримувану мову клієнта Minecraft ЛИШЕ для підкоманд, аргументів довідки, прапорців і автодоповнення, але не для кореневих команд.
# За false синтаксис відповідає мові використаної кореневої команди: /mb англійською, /bz іспанською тощо (якщо команду зареєстровано під час запуску).
# Для консолі та непідтримуваних мов клієнта використовується мова викликаної кореневої команди: /mba залишається англійською навіть за command-syntax.default: es.
# Мови повідомлень, інтерфейсу й дат залишаються незалежними від синтаксису команд.

