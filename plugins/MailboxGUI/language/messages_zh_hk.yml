# 紙信和書信使用獨立的傳送設定；玩家指令需要同時啟用對應類型及指令。管理員傳送開關獨立控制，已送達的信件仍可管理。
# gui.yml只改變顯示外觀及通知物品中繼資料，不改變實際位置、未檢查郵件的狀態管理或必要的收件箱保護。
# 遊戲內文字支援傳統 & 顏色代碼、HEX（&#RRGGBB 或 <#RRGGBB>）及受限的 MiniMessage 視覺格式。不支援點擊、滑鼠懸停或指令等互動標籤。
# ============================================================
# MailboxGUI | 一般
# ============================================================
# 只編輯顯示文字；保留鍵名、佔位符及顏色代碼。
# 版本欄位及舊語言檔案是遷移參考。升級時保留自訂翻譯；不要刪除檔案或重設設定。
# 紙本信件及包裹、金錢訊息最多允許256個可見字元，每行28個字元，內文共17行。自動換行、/n、實際換行及空白行共用此上限。//n顯示字面文字/n；顏色代碼不計入字元數。

# ------------------------------------------------------------
# 指令語法
# ------------------------------------------------------------
# 指令語法有獨立的語言設定，不會自動使用訊息語言。
# locale.command-syntax.default: 啟動時只會註冊此語言的根指令，以及一直可用的英語根指令。
# 更改已註冊的根指令需要重新啟動伺服器；reload不會註冊新的根指令。
# locale.command-syntax.auto-detect-player-locale: true只會對子指令、說明參數、選項旗標及Tab補全使用支援的Minecraft客戶端語言，不影響根指令。
# 設為false時，語法跟隨所用根指令的語言：/mb使用英語，/bz使用西班牙語等（前提是啟動時已註冊該根指令）。
# 控制台及不支援的客戶端語言會改用所呼叫根指令的語言：即使command-syntax.default: es，/mba仍使用英語。
# 訊息、GUI及日期的語言設定與指令語法互相獨立。

