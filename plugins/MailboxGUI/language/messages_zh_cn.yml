# 纸信和书信使用独立的发送设置；玩家命令需要同时启用对应类型及命令。管理员发送开关独立控制，已送达的信件仍可管理。
# gui.yml只改变显示外观和通知物品元数据，不改变实际位置、未检查邮件的状态管理或必需的收件箱保护。
# 游戏内文本支持传统 & 颜色代码、HEX（&#RRGGBB 或 <#RRGGBB>）以及受限的 MiniMessage 视觉格式。不支持点击、悬停或命令等交互标签。
# ============================================================
# MailboxGUI | 通用
# ============================================================
# 仅编辑显示文本；保留键名、占位符和颜色代码。
# 版本字段和旧语言文件是迁移参考。升级时保留自定义翻译；不要删除文件或重置设置。
# 纸质信件及包裹、金钱消息最多允许256个可见字符，每行28个字符，正文共17行。自动换行、/n、实际换行和空行共用此上限。//n显示字面文本/n；颜色代码不计入字符数。

# ------------------------------------------------------------
# 命令语法
# ------------------------------------------------------------
# 命令语法具有独立的语言设置，不会自动使用消息语言。
# locale.command-syntax.default: 启动时仅注册此语言的根命令，以及始终可用的英语根命令。
# 更改已注册的根命令需要重启服务器；reload不会注册新的根命令。
# locale.command-syntax.auto-detect-player-locale: true仅对子命令、帮助参数、选项标志和Tab补全使用受支持的Minecraft客户端语言，不影响根命令。
# 设为false时，语法跟随所用根命令的语言：/mb使用英语，/bz使用西班牙语等（前提是启动时已注册该根命令）。
# 控制台和不受支持的客户端语言回退到所调用根命令的语言：即使command-syntax.default: es，/mba仍使用英语。
# 消息、GUI和日期的语言设置与命令语法相互独立。

