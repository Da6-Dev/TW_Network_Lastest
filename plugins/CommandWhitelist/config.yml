
# Messages use MiniMessage formatting (https://docs.adventure.kyori.net/minimessage/format)
messages:
  prefix: '<gray>[Comandos]<reset> '
  command_denied: <red>Comando não disponível.
  subcommand_denied: <red>Você não pode usar esse subcomando.
  no_permission: <red>Você não tem permissão.
  no_such_subcommand: <red>Subcomando não encontrado.
  config_reloaded: <yellow>Configuração recarregada.
  added_to_whitelist: <yellow>Whitelisted command <gold>%s <yellow>for permission
    <gold>%s
  removed_from_whitelist: <yellow>Removed command <gold>%s <yellow>from permission
    <gold>%s
  group_doesnt_exist: <red>Group doesn't exist or error occured

# Do not enable if you don't have issues with aliased commands.
# This requires server restart to take effect.
use_protocollib: false

# Valid message types are CHAT and ACTIONBAR and CHAT_AND_ACTIONBAR.
message_type: CHAT
command_denied_sound:
  enabled: false
  key: BLOCK_NOTE_BLOCK_BASS
  volume: 1.0
  pitch: 1.0
